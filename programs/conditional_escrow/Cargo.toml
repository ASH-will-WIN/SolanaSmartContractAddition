[package]
name = "conditional_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "conditional_escrow"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
# Anchor's Solana 1.18 SBF toolchain uses Cargo 1.75, which cannot parse the
# edition-2024 dependency pulled by newer blake3 releases.
blake3 = "=1.5.0"
borsh = "=1.3.1"
proc-macro-crate = "=3.1.0"
zeroize_derive = "=1.4.2"
indexmap = "=2.2.6"
jobserver = "=0.1.26"
unicode-segmentation = "=1.10.1"
